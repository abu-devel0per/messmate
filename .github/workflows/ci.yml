name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-asyncio

      - name: Run linters
        run: |
          black --check .
          isort --check-only .
          flake8 . --max-line-length=88 --extend-ignore=E203,W503

      - name: Type check
        run: |
          mypy . --ignore-missing-imports --no-error-summary

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: messmate_test
          JWT_SECRET: test-secret-key-for-ci
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: 10080
          ENVIRONMENT: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: backend
          files: ./backend/coverage.xml

  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --watchAll=false --coverage
        # Uncomment when tests are configured:
        # run: npm test -- --watchAll=false --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: frontend
          files: ./frontend/coverage/lcov.info

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Python security audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Run Node.js security audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # Build Checks
  build:
    name: Build Checks
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend build check
        run: |
          cd backend
          python -m py_compile server.py
          echo "Backend syntax OK"

      - name: Frontend build check
        run: |
          cd frontend
          npm run build 2>&1 | head -50 || true
          # Expo web build for verification
          npx expo export --platform web 2>&1 | head -50 || true

  # Dependency Review
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # Notify on failure
  notify:
    name: Notify on Failure
    if: failure()
    needs: [backend-test, frontend-test, security-audit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "CI pipeline failed. Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here if configured